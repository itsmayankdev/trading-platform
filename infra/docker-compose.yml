services:

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: trading-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: trading
      POSTGRES_USER: trading_app
      POSTGRES_PASSWORD: trading_local_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_app -d trading"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: trading-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.app
    container_name: trading-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: Trading Platform API
      DATABASE_URL: postgresql+psycopg://trading_app:trading_local_password@postgres:5432/trading
      REDIS_URL: redis://redis:6379/0
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin-demo@marketmemory.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-DemoAdmin@2026}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-demo-admin-session-secret-change-before-production}
      PATTERN_SEARCH_PROFILE: ${PATTERN_SEARCH_PROFILE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ingestion-worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    container_name: trading-ingestion-worker
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: Trading Platform API
      DATABASE_URL: postgresql+psycopg://trading_app:trading_local_password@postgres:5432/trading
      REDIS_URL: redis://redis:6379/0
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "workers.ingestion.runner", "--workers", "2", "--poll-seconds", "5"]

  ingestion-scheduler:
    build:
      context: ..
      dockerfile: infra/Dockerfile.worker
    container_name: trading-ingestion-scheduler
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: Trading Platform API
      DATABASE_URL: postgresql+psycopg://trading_app:trading_local_password@postgres:5432/trading
      REDIS_URL: redis://redis:6379/0
      BINANCE_API_KEY: ""
      BINANCE_API_SECRET: ""
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "workers.ingestion.scheduler", "--interval-seconds", "300"]

volumes:
  postgres_data:
  redis_data:
